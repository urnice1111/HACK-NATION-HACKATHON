[project]
name = "agro-voice-mvp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["contracts*", "backend*", "advisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
